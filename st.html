<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hub Mall</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #7b68ee;
            color: white;
            padding: 20px;
            text-align: center;
        }
        nav {
            display: flex;
            justify-content: center;
            background-color: #333;
            padding: 10px;
        }
        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
        }
        nav a:hover {
            text-decoration: underline;
        }
        .featured-section {
            padding: 20px;
            text-align: center;
        }
        .featured-item {
            display: inline-block;
            margin: 20px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            width: 250px;
            text-align: center;
        }
        .featured-item img {
            max-width: 100%;
            border-radius: 10px;
        }
        .price {
            font-size: 18px;
            color: #6fb99f;
            margin-top: 10px;
        }
        footer {
            background-color: #728adf;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Welcome to Hub Mall</h1>
    </header>
    <nav>
        <a href="#home">Home</a>
        <a href="#stores">Stores</a>
        <a href="#offers">Offers</a>
        <a href="#contact">Contact</a>
    </nav>
    <section class="featured-section">
        <h2>Featured Stores</h2>
        <div class="featured-item">
            <img src="https://tse2.mm.bing.net/th?id=OIP.Qd6CAY875ysx9SBv8-F75gHaE9&pid=Api&P=0&h=220" alt="Fashion Hub">
            <h3>Fashion Hub</h3>
            <p>Trendy clothing and accessories.</p>
            <div class="price">RS 500 - RS 1000</div>
        </div>
        <div class="featured-item">
            <img src="https://tse2.mm.bing.net/th?id=OIP.sPdyL3lk4NrLYJ28kf3v0wHaEK&pid=Api&P=0&h=220" alt="Tech World">
            <h3>Tech World</h3>
            <p>The latest gadgets and electronics.</p>
            <div class="price">RS 5000 - RS 20000</div>
        </div>
        <div class="featured-item">
            <img src="https://tse4.mm.bing.net/th?id=OIP.BFCX11W03BTnMFvQQcxm4QHaE8&pid=Api&P=0&h=220" alt="Food Court">
            <h3>Food Court</h3>
            <p>Delicious cuisines to savor.</p>
            <div class="price">RS 100 - RS 500</div>
        </div>
    </section>
    <footer>
        <p>&copy; 2025 Hub Mall. All rights reserved.</p>
    </footer>
</body>
</html>
